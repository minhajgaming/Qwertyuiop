<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyApp Store - Play Store Clone</title>
    <style>
        :root {
            --primary: #01875f;
            --primary-dark: #056449;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #202124;
            --text-sub: #5f6368;
            --border: #dadce0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* Header & Navbar */
        header {
            background-color: var(--card-bg);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box {
            flex: 1;
            max-width: 500px;
            display: flex;
        }

        .search-box input {
            width: 100%;
            padding: 10px 18px;
            border: 1px solid var(--border);
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            background: #f1f3f4;
        }

        .search-box input:focus {
            background: #fff;
            border-color: var(--primary);
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        /* Category Filter */
        .categories {
            padding: 15px 5%;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            background: #fff;
            border-bottom: 1px solid var(--border);
        }

        .cat-btn {
            padding: 8px 18px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: #fff;
            color: var(--text-sub);
            cursor: pointer;
            font-weight: 500;
            white-space: nowrap;
            transition: 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            background-color: #e6f3ef;
            color: var(--primary);
            border-color: var(--primary);
        }

        /* App Grid */
        .container {
            padding: 25px 5%;
            max-width: 1300px;
            margin: auto;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .app-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid transparent;
        }

        .app-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
            border-color: var(--border);
        }

        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            object-fit: cover;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .app-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .app-dev {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .app-meta {
            font-size: 13px;
            color: var(--text-sub);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Modal (App Details View) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            padding: 25px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 26px;
            cursor: pointer;
            color: var(--text-sub);
        }

        .modal-header {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-icon {
            width: 90px;
            height: 90px;
            border-radius: 20px;
        }

        .modal-stats {
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
            text-align: center;
        }

        .stat-box strong {
            display: block;
            font-size: 16px;
        }

        .stat-box span {
            font-size: 12px;
            color: var(--text-sub);
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            transition: background 0.2s;
        }

        .download-btn:hover {
            background: var(--primary-dark);
        }

        .app-desc {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-sub);
        }

        @media (max-width: 600px) {
            .app-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .modal-header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header>
        <div class="logo">▶ MyApp Store</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="অ্যাপ বা গেম খুঁজুন..." onkeyup="filterApps()">
        </div>
    </header>

    <!-- Categories -->
    <div class="categories">
        <button class="cat-btn active" onclick="setCategory('All', this)">সব অ্যাপ (All)</button>
        <button class="cat-btn" onclick="setCategory('Games', this)">গেমস (Games)</button>
        <button class="cat-btn" onclick="setCategory('Social', this)">সোশ্যাল (Social)</button>
        <button class="cat-btn" onclick="setCategory('Tools', this)">টুলস (Tools)</button>
        <button class="cat-btn" onclick="setCategory('Editing', this)">এডিটিং (Editing)</button>
    </div>

    <!-- Main Content -->
    <div class="container">
        <h2 class="section-title" id="sectionTitle">জনপ্রিয় অ্যাপ ও গেমস</h2>
        <div class="app-grid" id="appGrid"></div>
    </div>

    <!-- App Details Modal -->
    <div class="modal" id="appModal" onclick="closeModal(event)">
        <div class="modal-content">
            <span class="close-btn" onclick="document.getElementById('appModal').style.display='none'">&times;</span>
            <div class="modal-header">
                <img src="" id="mIcon" class="modal-icon" alt="Icon">
                <div>
                    <h2 id="mName">App Name</h2>
                    <p id="mDev" style="color: var(--primary); font-weight: 500; margin: 5px 0;">Developer</p>
                    <span id="mCat" style="font-size: 12px; background: #eee; padding: 3px 8px; border-radius: 4px;">Category</span>
                </div>
            </div>

            <div class="modal-stats">
                <div class="stat-box">
                    <strong id="mRating">4.8 ★</strong>
                    <span>রেটিং</span>
                </div>
                <div class="stat-box">
                    <strong id="mSize">45 MB</strong>
                    <span>ফাইল সাইজ</span>
                </div>
                <div class="stat-box">
                    <strong id="mDownloads">10M+</strong>
                    <span>ডাউনলোড</span>
                </div>
                <div class="stat-box">
                    <strong id="mVersion">v2.4.1</strong>
                    <span>ভার্সন</span>
                </div>
            </div>

            <a href="#" id="mDownloadLink" class="download-btn" target="_blank">Install / Download APK</a>

            <h4 style="margin-bottom: 8px;">অ্যাপ সম্পর্কে (About this app):</h4>
            <p class="app-desc" id="mDesc">App description goes here...</p>
        </div>
    </div>

    <script>
        // অ্যাপের ডাটাবেস (এখানে আপনি আপনার নিজের অ্যাপ এবং ডাউনলোড লিংক যুক্ত করতে পারবেন)
        const appsData = [
            {
                id: 1,
                name: "PhotoMaster Pro",
                developer: "Creative Studio",
                category: "Editing",
                rating: "4.8 ★",
                size: "42 MB",
                downloads: "5M+",
                version: "v3.2.0",
                icon: "https://cdn-icons-png.flaticon.com/512/1040/1040241.png",
                downloadUrl: "#download-photomaster", // এখানে আপনার APK ফাইলের আসল লিংক বসাবেন
                description: "PhotoMaster Pro দিয়ে খুব সহজেই প্রফেশনাল ছবি এডিট করুন। এতে রয়েছে এআই ব্যাকগ্রাউন্ড রিমুভার, ফিল্টার এবং হাই-রেজোলিউশন এক্সপোর্ট সুবিধা।"
            },
            {
                id: 2,
                name: "Speed Racer 3D",
                developer: "NextGen Games",
                category: "Games",
                rating: "4.6 ★",
                size: "120 MB",
                downloads: "10M+",
                version: "v1.8.5",
                icon: "https://cdn-icons-png.flaticon.com/512/3097/3097144.png",
                downloadUrl: "#download-speedracer",
                description: "অসাধারণ গ্রাফিক্স এবং হাই-স্পিড কার রেসিং গেম। অফলাইনে এবং অনলাইনে বন্ধুদের সাথে মাল্টিপ্লেয়ার মোডে খেলার সুবিধা।"
            },
            {
                id: 3,
                name: "QuickShare File Transfer",
                developer: "TechTools Inc.",
                category: "Tools",
                rating: "4.9 ★",
                size: "12 MB",
                downloads: "50M+",
                version: "v5.0.1",
                icon: "https://cdn-icons-png.flaticon.com/512/2991/2991112.png",
                downloadUrl: "#download-quickshare",
                description: "ইন্টারনেট ছাড়াই যেকোনো বড় ফাইল, ভিডিও বা অ্যাপ মুহূর্তের মধ্যে এক ফোন থেকে অন্য ফোনে শেয়ার করুন।"
            },
            {
                id: 4,
                name: "ChatBuzz Messenger",
                developer: "Connect Social",
                category: "Social",
                rating: "4.5 ★",
                size: "35 MB",
                downloads: "100M+",
                version: "v12.4",
                icon: "https://cdn-icons-png.flaticon.com/512/134/134914.png",
                downloadUrl: "#download-chatbuzz",
                description: "নিরাপদ এবং দ্রুতগতির মেসেজিং অ্যাপ। এইচডি ভিডিও কল এবং এন্ড-টু-এন্ড এনক্রিপ্টেড চ্যাটিং সুবিধা।"
            },
            {
                id: 5,
                name: "PDF Scanner & Reader",
                developer: "OfficeMate",
                category: "Tools",
                rating: "4.7 ★",
                size: "18 MB",
                downloads: "2M+",
                version: "v2.1.0",
                icon: "https://cdn-icons-png.flaticon.com/512/337/337946.png",
                downloadUrl: "#download-pdfscanner",
                description: "যেকোনো ডকুমেন্ট ক্যামেরা দিয়ে স্ক্যান করে পরিষ্কার PDF ফাইলে রূপান্তর করুন এবং পাসওয়ার্ড দিয়ে সুরক্ষিত রাখুন।"
            },
            {
                id: 6,
                name: "Galaxy Shooter",
                developer: "Arcade World",
                category: "Games",
                rating: "4.4 ★",
                size: "65 MB",
                downloads: "1M+",
                version: "v1.4.2",
                icon: "https://cdn-icons-png.flaticon.com/512/808/808439.png",
                downloadUrl: "#download-galaxyshooter",
                description: "মহাকাশের শত্রুদের হাত থেকে পৃথিবীকে রক্ষা করুন। ১০০টিরও বেশি চ্যালেঞ্জিং লেভেল এবং বস ফাইট।"
            }
        ];

        let currentCategory = 'All';

        // অ্যাপ কার্ড রেন্ডার করার ফাংশন
        function renderApps(apps) {
            const grid = document.getElementById('appGrid');
            grid.innerHTML = '';

            if (apps.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#666;">কোনো অ্যাপ পাওয়া যায়নি!</p>';
                return;
            }

            apps.forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.onclick = () => openModal(app);
                card.innerHTML = `
                    <img src="${app.icon}" alt="${app.name}" class="app-icon">
                    <div class="app-name">${app.name}</div>
                    <div class="app-dev">${app.developer}</div>
                    <div class="app-meta">
                        <span>${app.rating}</span>
                        <span>•</span>
                        <span>${app.size}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ক্যাটাগরি ফিল্টারfunction setCategory(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterApps();
        }

        // সার্চ ও ক্যাটাগরি অনুযায়ী ফিল্টার
        function filterApps() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const filtered = appsData.filter(app => {
                const matchesCat = currentCategory === 'All' || app.category === currentCategory;
                const matchesSearch = app.name.toLowerCase().includes(searchText) || app.developer.toLowerCase().includes(searchText);
                return matchesCat && matchesSearch;
            });
            renderApps(filtered);
        }

        // পপ-আপ (Modal) ওপেন করা
        function openModal(app) {
            document.getElementById('mIcon').src = app.icon;
            document.getElementById('mName').innerText = app.name;
            document.getElementById('mDev').innerText = app.developer;
            document.getElementById('mCat').innerText = app.category;
            document.getElementById('mRating').innerText = app.rating;
            document.getElementById('mSize').innerText = app.size;
            document.getElementById('mDownloads').innerText = app.downloads;
            document.getElementById('mVersion').innerText = app.version;
            document.getElementById('mDesc').innerText = app.description;
            document.getElementById('mDownloadLink').href = app.downloadUrl;

            document.getElementById('appModal').style.display = 'flex';
        }

        // পপ-আপের বাইরে ক্লিক করলে বন্ধ হওয়া
        function closeModal(e) {
            if (e.target.id === 'appModal') {
                document.getElementById('appModal').style.display = 'none';
            }
        }

        // পেজ লোড হলে সব অ্যাপ দেখাবে
        renderApps(appsData);
    </script>
</body>
</html>
